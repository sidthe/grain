name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  GOFLAGS: -mod=readonly
jobs:
  go-goal:
    capabilities: []
    name: go-goal
    paths:
      - go.mod
      - go.sum
      - pkg/model/**
      - pkg/mcp/**
      - pkg/agent/**
      - pkg/orchestrator/**
      - pkg/daemon/**
      - pkg/ui/**
      - tests/hygiene/**
    timeout-minutes: 15
    steps:
      - name: Format, vet, and test Goal Mode Go packages
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp" GOTMPDIR="$PWD/.ci-tmp"
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all GIT_CONFIG_KEY_1=init.defaultRefFormat GIT_CONFIG_VALUE_1=files
          bad_fmt=$(gofmt -l pkg/model pkg/mcp pkg/agent pkg/orchestrator pkg/daemon pkg/ui tests/hygiene)
          if [ -n "$bad_fmt" ]; then
            echo "gofmt needed on:"
            echo "$bad_fmt"
            exit 1
          fi
          go vet ./pkg/model ./pkg/mcp ./pkg/agent/... ./pkg/orchestrator ./pkg/daemon ./pkg/ui ./tests/hygiene
          go test -count=1 ./pkg/model ./pkg/mcp ./pkg/agent/... ./pkg/ui ./tests/hygiene
          go test -count=1 -run 'Goal|StopRule' ./pkg/orchestrator

  ui-ng:
    capabilities: []
    name: ui-ng
    paths:
      - ui-ng/**
      - pkg/ui/**
    timeout-minutes: 15
    steps:
      - name: Format, lint, unit-test, and build ui-ng
        working-directory: ui-ng
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp"
          export PATH="/usr/local/google/home/rarcea/.local/node/bin:$PATH"
          npm ci --prefer-offline --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test -- --watch=false
          npm run build

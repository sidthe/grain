name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  GOFLAGS: -mod=readonly
jobs:
  go-qa-model:
    capabilities: []
    name: go-qa-model
    paths:
      - go.mod
      - go.sum
      - pkg/qa/**
      - pkg/model/**
      - pkg/declschema/**
      - pkg/repodecl/**
      - pkg/staterepo/**
      - tests/hygiene/**
    timeout-minutes: 15
    steps:
      - name: Vet and test QA, model, declschema, staterepo, and hygiene
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'chmod -R u+w "${GOPATH:-}" "$PWD/.ci-tmp" 2>/dev/null || true; rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp" GOTMPDIR="$PWD/.ci-tmp"
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all GIT_CONFIG_KEY_1=init.defaultRefFormat GIT_CONFIG_VALUE_1=files
          go vet ./pkg/qa/... ./pkg/model/... ./pkg/declschema/... ./pkg/repodecl/... ./pkg/staterepo/...
          go test -count=1 ./pkg/qa/... ./pkg/declschema/... ./tests/hygiene
          go test -count=1 -skip TestOverlapSkipScheduleTemplatesDoNotEndInAwaitingReply ./pkg/repodecl
          go test -count=1 ./pkg/model ./pkg/model/v2baseline
          go test -count=1 -run 'TestEveryVersionPast|Migration|QAFlow|QAExperiment|Compose' ./pkg/model/sqlite
          go test -count=1 -run 'ValidateStateVersion|Fidelity|SettingsTables|TheDumpHoldsNoFile|EverySettingsColumn' ./pkg/staterepo

  go-orch-ui:
    capabilities: []
    name: go-orch-ui
    paths:
      - go.mod
      - go.sum
      - pkg/qa/**
      - pkg/model/**
      - pkg/orchestrator/**
      - pkg/ui/**
    timeout-minutes: 15
    steps:
      - name: Vet and test orchestrator QA lifecycle and UI handlers/invariants
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'chmod -R u+w "${GOPATH:-}" "$PWD/.ci-tmp" 2>/dev/null || true; rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp" GOTMPDIR="$PWD/.ci-tmp"
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all GIT_CONFIG_KEY_1=init.defaultRefFormat GIT_CONFIG_VALUE_1=files
          go vet ./pkg/orchestrator ./pkg/ui
          go test -count=1 -run 'QA|Phase|Triage|Prompt|FormatQueueTask' ./pkg/orchestrator
          go test -count=1 -run 'QA|Composition|Schedule|Template|Suite|MergeRecheck|AngularRouteTable|RoleGate|MutatingRoute|Explore|AgentAPI' ./pkg/ui

  ui-ng:
    capabilities: []
    name: ui-ng
    paths:
      - ui-ng/**
      - design/design/ui-design-book.design.md
    timeout-minutes: 15
    steps:
      - name: Format, lint, unit-test, and build ui-ng
        working-directory: ui-ng
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp"
          npm ci --prefer-offline --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test -- --watch=false
          npm run build

name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  GOFLAGS: -mod=readonly
jobs:
  go-leaf-1:
    capabilities: []
    name: go-leaf-1
    paths:
      - go.mod
      - go.sum
      - pkg/sandboxaddr/**
      - pkg/gitrefs/**
      - pkg/portpick/**
      - pkg/schedulefilter/**
      - pkg/treeid/**
    timeout-minutes: 10
    steps:
      - name: Vet and test leaf Go packages (1-5)
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp" GOTMPDIR="$PWD/.ci-tmp"
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all GIT_CONFIG_KEY_1=init.defaultRefFormat GIT_CONFIG_VALUE_1=files
          go vet ./pkg/sandboxaddr ./pkg/gitrefs ./pkg/portpick ./pkg/schedulefilter ./pkg/treeid
          go test -count=1 ./pkg/sandboxaddr ./pkg/gitrefs ./pkg/portpick ./pkg/schedulefilter ./pkg/treeid

  go-leaf-2:
    capabilities: []
    name: go-leaf-2
    paths:
      - go.mod
      - go.sum
      - pkg/sysstat/**
      - pkg/hostscriptcli/**
      - pkg/namespace/**
      - pkg/releasenotes/**
      - pkg/designdoc/**
    timeout-minutes: 10
    steps:
      - name: Vet and test leaf Go packages (6-10)
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp" GOTMPDIR="$PWD/.ci-tmp"
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all GIT_CONFIG_KEY_1=init.defaultRefFormat GIT_CONFIG_VALUE_1=files
          go vet ./pkg/sysstat ./pkg/hostscriptcli ./pkg/namespace ./pkg/releasenotes ./pkg/designdoc
          go test -count=1 ./pkg/sysstat ./pkg/hostscriptcli ./pkg/namespace ./pkg/releasenotes ./pkg/designdoc

  go-multi:
    capabilities: []
    name: go-multi
    paths:
      - go.mod
      - go.sum
      - pkg/declschema/**
      - pkg/repodecl/**
      - pkg/staterepo/**
      - pkg/orchestrator/*.go
      - pkg/metrics/**
      - pkg/ci/**
      - pkg/workflows/**
    timeout-minutes: 10
    steps:
      - name: Vet and test multi-package Go targets (11-15)
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp" GOTMPDIR="$PWD/.ci-tmp"
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all GIT_CONFIG_KEY_1=init.defaultRefFormat GIT_CONFIG_VALUE_1=files
          go vet ./pkg/declschema ./pkg/repodecl ./pkg/staterepo ./pkg/orchestrator ./pkg/metrics ./pkg/ci ./pkg/workflows
          go test -count=1 ./pkg/declschema ./pkg/repodecl ./pkg/metrics ./pkg/workflows
          go test -count=1 -run 'ValidateStateVersion' ./pkg/staterepo
          go test -count=1 -run 'FormatQueueTask' ./pkg/orchestrator
          go test -count=1 -run 'WrapTag|FormatTag' ./pkg/ci

  ui-ng:
    capabilities: []
    name: ui-ng
    paths:
      - ui-ng/**
      - pkg/ui/**
    timeout-minutes: 15
    steps:
      - name: Format, lint, unit-test, and build ui-ng
        working-directory: ui-ng
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.ci-tmp"
          trap 'rm -rf "$PWD/.ci-tmp"' EXIT
          export TMPDIR="$PWD/.ci-tmp"
          npm ci --prefer-offline --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test -- --watch=false
          npm run build

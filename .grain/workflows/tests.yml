name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ui-ng:
    capabilities: []
    name: ui-ng
    paths:
      - ui-ng/**
      - pkg/ui/**
    timeout-minutes: 15
    steps:
      - name: Format, lint, unit-test, and build ui-ng
        working-directory: ui-ng
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test -- --watch=false
          npm run build

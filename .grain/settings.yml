prompt-extension: |
  ## Commit Message Standards for Agents

  All commits generated by agents MUST follow the Conventional Commits specification:
  - `fix:` / `fix(<scope>): <short description>` — Bug fixes, patches, and regressions.
  - `feat:` / `feat(<scope>): <short description>` — New features or functional enhancements.
  - `refactor:`, `test:`, `chore:`, `docs:` for non-functional updates.

  ## Angular UI (`ui-ng/`) Changes

  - Build UI features and parity fixes in `ui-ng/` following `design/design/ui-design-book.design.md`.
  - Before pushing or calling `open_pull_request`, run `npm ci --prefer-offline --no-audit --no-fund` (if `node_modules` is absent), `npm run format`, `npm run lint`, `npm test -- --watch=false`, and `npm run build` inside `ui-ng/`, and fix all test, lint, and CSS/bundle budget errors.
  - Ship focused Vitest unit tests (`*.spec.ts`) alongside every behavior change.
  - Do not launch `grain demo` or full-browser Playwright servers inside unattended task sandboxes; Grain CI and automated code review verify your pull request once opened via `open_pull_request`.

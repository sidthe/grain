name: UI walkthrough - Settings' connections and infrastructure sections
title: Walk through Settings -- Git, Hosts, Capabilities, Registry & Hub, Engine, CI, Sandboxes and Caches
base: main
auto-merge: true
body: |
  Thoroughly exercise the Settings sections that connect grain to
  outside systems and tune the machines it runs on -- Git, Hosts,
  Capabilities (including secrets and deployment credentials), Registry
  & Hub, Engine, CI, Sandboxes and Caches, at `/next/settings/<section>`
  -- in a real browser against a real server. Settings' layout, filter,
  save and lock model and its other sections (Models, Preferences,
  Access, CLI, Audit, Config repo, General, Agents, Tasks, Memory) are
  the settings walkthrough's; the live sandbox, cache and CI status on
  Fleet and the CI page is the operations walkthrough's.

  ## Coverage

  - Git (`/next/settings/git`, Git connections & tokens): add, test and
    remove a throwaway connection as a Plain git host and as a GitHub
    host (the Host kind choice is sent in both new and stored-credential
    modes, so a plain host is never rewritten to GitHub; GitHub App is
    offered only for GitHub), save it (connections are savable), and
    Remove it through its confirmation. SSH key with known hosts, Reuse
    authentication from, the refusal banner clearing on a fixed save, the
    GitHub host pointer to `Settings → Capabilities#credentials` and the
    no-git-connection notice in New task and on Repos are classic-only:
    walk them at classic `/settings/git`.
  - Hosts (`/next/settings/hosts` and `/settings/hostds`, Registered
    workstation hosts): the Invite hosts block (the active `default` code's
    install command with Copy invite command, Show/Copy code, chips for
    uses, capacity, labels, allowed principals and expiry, the code picker
    when there are several, and a revoked code saying so with no Rotate or
    Revoke); New code, Rotate and Revoke a throwaway code; Pending host
    requests (verified enrollee, the key fingerprint wrapped in its cell,
    editable name/labels/capacity, Accept and Reject); the hosts list with
    each host's status, an `Update available: <build> → <release>` line
    with the `grain-agentd update -version <release>` command where one is
    offered, and every destructive action (Revoke, Delete, Delete all
    revoked) behind a confirmation. Confirm the page says "host", never
    "hostd". Edit owner/labels/capacity, Rename, host address/principal/
    build columns and the cleared-pauses report on Delete are
    classic-only.
  - Capabilities (`/next/settings/capabilities`, Capability servers
    (MCP)): built-in and configured servers with their state chips (a
    placed server waiting on its host reads `needs host <selector>`, a
    failed one in the error tone, the chip's title giving the reason, and
    the server saying where it is placed); configure, test and Remove (it
    asks first) a throwaway server; and old `settings/capability-servers`
    and `#<old-name>` anchors landing on the right card. The retired-grant
    deprecation notices, `(i)` popovers, schema forms (`Host` placement,
    `gcp` keyless vs key mode, `figma` Connect), the
    `/settings/capabilities/<id>` page, config-map/secret-map placements
    and the host process server's scripts are classic-only.
  - Capability policy and scope sets (`#capability-policy`, API scope
    sets & secret vault): edit the policy, save, reload, and confirm the
    New task sheet's Capabilities & repo context reflects `denied` and
    `may_be_refused` verdicts; create and edit a throwaway API scope set.
    Scope-set Remove (asking first when grants hold it) and policy
    verdicts in the template, schedule and repo-default pickers are
    classic-only.
  - Secrets and deployment credentials (`#credentials`, `#other-secrets`
    at the foot of Capabilities; the old `/settings/credentials`,
    `/settings/secrets`, `/admin/integrations` and `/system/integrations`
    links land there): store a throwaway secret (the value is masked while
    typed and a PEM keeps its newlines), replace and remove it; with no
    secrets store the form says so and disables Store. The GitHub host
    and GCP project fields, retired capability secrets and the
    `settings:write` vs `secrets:write` gating of the classic
    `SecretsPanel` are walked on classic.
  - Hub (`/next/settings/registry`, Registry & Hub): the Grain Hub
    connection card (status, Heartbeat now, last heartbeat and health,
    Hub URL, entry name, credential source, and the registration token as
    a secret field). Scope overrides (`#registry-scopes`) and the
    remaining hub fields are classic-only.
  - Engine (`/next/settings/engine`): Poll interval (its placeholder is
    the server's default) and Max worker agents, Max merges per repo
    branch; blank resets each to its default (10 and 5), every box carries
    its hint, and out-of-range values are refused. The sandbox commitment
    note is classic-only.
  - CI and Caches: on CI (`/next/settings/ci`, CI runner & retention
    defaults) the queue, history, job cache and artifacts settings, with
    Flush CI job cache asking first; on Caches (`/next/settings/caches`)
    the proxy and Actions cache sizes, and Flush disabled while caches are
    off and confirming before it flushes. Save, reload and verify the
    values read back.
  - Sandboxes (`/next/settings/sandboxes`): Sandbox backend & sizing (the
    backends and network values the server offers, ones this daemon
    cannot run shown disabled with its reason), Overcommit & Kubernetes
    pod settings (a fixed overcommit of 0 says it leaves that dimension
    unbounded), Persistent sandboxes, and Probe sandbox runtime offered
    only where a prober can run (absent on `grain demo`). The None
    backend description, auto overcommit bounds, disk floor and custom
    image card are classic-only.
  - Stub the git-host, GitHub, capability-server, Hub, secret-validation,
    host-process and Kubernetes boundaries only where the demo lacks
    them, retaining the real Grain server and browser UI, and document
    each intercepted route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-connections-infrastructure-settings.md`. Do not
    commit screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.

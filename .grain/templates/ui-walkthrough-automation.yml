name: UI walkthrough - processes, schedules, templates, suites
title: Walk through Processes -- schedules, templates, suites, suite runs and triggers
base: main
auto-merge: true
body: |
  Thoroughly exercise Grain's recurring and composed-work automation UI
  -- the Processes page and the schedules, templates, suites, suite runs
  and triggers it lists -- end to end, in a real browser against a real
  server.

  ## Coverage

  - Processes (`/next/processes`, from the rail): its four tabs
    (Schedules & Triggers, Templates, Suites & Runs, Repo Workflows &
    Declarations) with their counts, each tab's filter chips (All,
    Active, Paused, Event triggers, Suppressed on schedules; All,
    Deployment, Repo-declared, Built-in on templates; Suites / Suite runs
    on suites), `Filter this view` (`/`) written to `?q=`, and the Sort
    pill (Custom order, Next run, Last run, Name, and Kind except on
    suites) in `?sort=`, all kept through tab switches, reload and
    Back/Forward. In Custom order move a row with Alt+ArrowUp/Down
    (announced) and by dragging, and confirm the classic `/processes` page
    shows the same order. Template and suite rows show the last and next
    run derived from the schedules that fire them ("on demand" when none
    does). The old `/next/schedules`, `/next/templates`, `/next/suites`
    links and their `/<id>` and `/next/processes/suites/runs/<id>` item
    links land on the matching tab and item; a missing id says so.
  - New: the header's New ▾ menu (Schedule, Template, Suite, and the note
    that workflow schedules and triggers are declared in a repository's
    `.grain/`) switches to that kind's tab and opens its form;
    `?new=template` and `?new=suite` deep-link the same forms; the
    Create menu's New schedule, Task from template and Run a suite reach
    them from any page. A refused save shows its error inside the dialog.
  - Schedules (`/next/processes/schedules`): create prompt-, template- and
    suite-backed schedules; recurrence (Every N min with its ten-minute
    floor, Every N hr, Daily, Weekly, Monthly, GitHub workflow, Git ref
    push -- a forbidden watched repo refused, an off-target `git_ref`
    schedule showing its Suppressed chip and banner and no next run, yet
    still pausable); overlap policy; draft and saved composition preview.
    Pause, Resume, Run now, follow the fired task link, edit, and Delete a
    throwaway schedule through its confirmation; confirm the row and its
    template's and suite's rows follow without a reload.
  - A held schedule's detail: the suppression reason in words
    ("Suppressed -- publishing held: …", not a wire code), the overlap
    group beside Overlap, each skip saying whether it later fired (and as
    which task, with occurrences folded in) or was dropped, and no Next
    line on an event trigger. Check it at phone and desktop widths.
  - Templates (`/next/processes/templates`): create and edit a template
    (parameters, field label/default/required, auto-merge), preview with
    placeholders only for required fields, Launch task (unbound templates
    with `Reads` drop the chosen target repo rather than failing), rename
    it while a suite uses it (the suite's members and preview follow
    without a reload), and try Delete while it is referenced (refused,
    naming the suite) before removing only throwaway data.
  - Suites & Runs (`/next/processes/suites`): create and edit a suite
    (Fixed pass count / Until clean with its maximum, member templates,
    Require approval, Auto-merge, composition preview); a role without
    `suites:write` sees New suite and Run suite hidden and the inspector's
    Run suite, Edit and Delete disabled. Start a run from the inspector
    and from the header, then inspect Suite runs: Active, Succeeded and
    Failed runs, a base-less run reading "default branch", a run that
    filed no pass saying so, pass grouping with `↳ Spawned` follow-ups,
    task links (Back returns), cancelling an active run, and status chips
    whole at phone width.
  - Repo Workflows & Declarations and declared rows: the "Read <repo>'s
    own declarations" switch (an invalid `.grain/` file shows its line
    error), Accept declaration, the discovered `.grain/` files, and the
    trigger rows in Schedules & Triggers ("next: on change", under All and
    Event triggers, linking to `/next/repos/<owner>/<name>/advanced`).
    Declared schedules, templates and suites carry their `.grain` badge
    and a read-only banner naming the repository and file, with Edit and
    Delete hidden and Pause disabled; a workflow schedule carries no
    System chip and its Run now confirms that it starts a CI run of the
    declared workflow straight away.
  - Classic-only Processes controls (walk them at `/processes` until
    `/next/` has them): schedule and template Admission (`Standard`,
    `Bypass queue`, `Durable`), Hosting (`Unattended`, `Interactive
    console`), Keep running, network, reads/writes and custom fields;
    `GrantsPicker` with the Grain API group and capability policy
    verdicts (disabled on declared rows); the searchable agent and model
    picker; template Task priority (`1e3` normalized, whole numbers only),
    sandbox shape, Reviewers and the Interactive switch; New task from
    this template (its priority carried into `/new`, or Use… for a
    template with input fields, with the interactive-chat note); the
    suite form's searchable Templates picker and inline `+ New template`;
    and an unsaved schedule edit asking once before a task link leaves.
  - The demo may not run real agents. Stub only the agent/execution
    boundary, or seed through the real server's supported store/demo
    path, to obtain realistic run states; every create/edit/run gesture
    and all rendering must still pass through the real browser UI and
    the real Grain server.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-recurring-composed-ui.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.

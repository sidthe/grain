name: UI walkthrough - Settings, its layout, lock and save model, Preferences, Access, CLI, Audit, Models, Config repo, General, Agents, Tasks, Memory and Context
title: Walk through Settings -- its layout, lock and save model, Preferences, Access, CLI, Audit, General, Config repo, Models, Agents, Tasks and Memory -- and the Context page
base: main
auto-merge: true
body: |
  Thoroughly exercise Settings (`/next/settings`) -- its layout, filter,
  save, role and config-repo lock model, the browser's own Preferences,
  Access, CLI, Audit, Models, Config repo, General, Agents, Tasks and
  Memory -- and the Context page (`/next/context`), in a real browser
  against a real server. Settings' Git, Hosts, Capabilities, Registry &
  Hub, Engine, CI, Sandboxes and Caches sections are the infrastructure
  walkthrough's; Fleet, Telemetry, Settings → Upgrade and CI are the
  operations walkthrough's; Settings → Repositories is the repos
  walkthrough's.

  ## Coverage

  - Layout and paths (`/next/settings`): open it from the rail's Settings
    entry (on a phone, from the More sheet). Bare `/settings` opens
    Models on desktop and, on a phone, the grouped section list (Models &
    Compute, Repositories & Code, Work & Agents, Access & Security,
    Instance & Preferences), where a section opens alone under a back
    arrow with no sideways overflow. Each section rides in the URL
    (`/next/settings/<section>`) through reload and Back/Forward, and a
    `#<card>` fragment (`/settings/models#usage`,
    `/settings/capabilities#credentials`) scrolls that card to its heading
    once the section has loaded. Old links land on their section, not the
    Inbox: `/admin` and unknown `/admin/<tab>` on General, `/admin/workflow`
    on Tasks, `/admin/agents` on Agents, `/admin/state` on Config repo,
    `/admin/executors` and `/system/executors` on Hosts (`/settings/hosts`
    and `/settings/hostds`), `/admin/integrations` and
    `/system/integrations` on Capabilities' credentials card,
    `/admin/upgrade` and `/system/upgrade` on Upgrade,
    `/settings/config-repo/<file>` and `/config?path=<file>` on the Config
    repo file viewer, and an old `settings/connections` link on Models
    (on a phone too). Confirm `/memory` opens Context, not Settings.
  - Filter and save model on `/next/`: press `/` in Settings to focus the
    filter; a label or keyword lists matches by section, choosing one
    opens that section, a miss says so, and `Escape` restores the groups.
    Each card saves with its own Save (and Discard where offered);
    confirm leaving a card with unsaved edits asks first and a clean one
    never does, the field reads back what the server answered, an
    out-of-range number is refused by name before saving, a refused save
    says why, and Upgrade, Audit and CLI show no Save bar. A section whose
    write scope the signed-in role lacks renders read-only with its
    reason; under an external config repo or the settings lock, the
    config-managed sections render disabled and say where to change them.
  - Classic-only Settings mechanics (walk at classic `/settings` until
    `/next/` has them): commit-on-change/blur fields with the header state
    line (Saving…, Unsaved changes in <card>, Couldn't save <field> with
    Retry, All changes saved) and the dirty dot in the section nav; the
    tablet Section select; field-level filter results that reveal, focus
    and outline the field; the Restart needed chip; Preferences →
    Customize pinned items; and a held config-repo pull request offered
    when a write is refused.
  - Preferences (`/next/settings/preferences`, Browser preferences):
    Color theme (`t` in the shell toggles it too), Single-key keyboard
    shortcuts (turned off, `c`, `/`, digits and `?` type rather than
    act), the default UI preference and the navigation rail order (the
    same order Customize navigation edits). Verify nothing deployment-wide
    is saved from here. Task-timeline order and the per-browser time zone
    are classic-only.
  - Access (`/next/settings/access`): usable even when settings are
    config-managed. RBAC allowlist & roles -- grant access with a role,
    change a role, remove an entry (asking first, and warning when it is
    your own or the last), and a malformed principal refused; External
    agent tokens (`gma_`) -- issue a throwaway token with its scopes, see
    it once, and revoke it; GCP service account keys. Walk the This
    browser card (how you signed in, Log out), the separate People &
    groups and Service accounts tables with added-at timestamps, and the
    `Signed out` / `Access Denied` deep-link return on classic until
    `/next/` has them.
  - CLI (`/next/settings/cli`) and Audit (`/next/settings/audit`): on CLI,
    the Install command (naming the running release when versioned), Sign
    in (`grain login … --issue-token --scope-set grain/external-dev`) and
    Agent skills cards and their Copy buttons; on Audit, the read-only
    Configuration changes (never secret values), Credential access and
    Secret resolutions logs, each with its own empty and error state, and
    the stacked layout at phone width.
  - General and Config repo: General's Deployment identity & UI lock
    card (environment display name, deployment ID, Display timezone --
    printed times across Tasks, the task page and Telemetry follow it --
    and the settings lock, disabled when the deployment has no config
    repo) and Broadcast message to active tasks (Running tasks only, and
    the comment it posts appearing on a running task; broadcast only in
    the throwaway demo store); Updates and About are classic-only for
    now. Config repo: StateRepo synchronization and its status, Remote
    repository & KMS secret key, the read-only Config repository file
    viewer (`/next/settings/config-repo/<file>` with commit stamp and
    JSON/Markdown preview), and the failing-sync Inbox row pointing back
    here.
  - Models (`/next/settings/models`): provider connections (New
    connection, Edit and Remove, which asks first; clearing a stored
    secret asks first too; a role without access sees no Refresh), the
    models each connection discovers feeding the model pickers in New task
    and sessions (a provider that never answered shows no refresh time),
    the default model and reasoning effort, paused models with their reset
    time on the local clock and zone, and the Token budget & usage
    guardrails card (`#usage`). Confirm the standalone Framework API keys card is gone and
    the page makes no `/api/agent-keys` call. Connection Test,
    Enable/Disable, stored vs ambient Credentials, Run on host placement
    with fallback hosts, paused-model resume and the Where each agent CLI
    runs card are classic-only: walk them there.
  - Agents and Tasks: Agents' Agent turn limits & default grants,
    Standing console sessions and Agent Git identity & host; Tasks' Task
    approval, merge queue & gates card (default approval, auto-merge
    depth and fan-out, branch naming templates) and the Quality control &
    PR rollout card (Enable quality control engine, Quality flow package,
    PR rollout (%) -- off by default, and flipping it back off clears the
    dependent edits); save, reload, and confirm a new task picks them up.
    Task fields (with the `custom.<name>:legacy` link), Default grants via
    `GrantsPicker`, Task branches validation and the External agents card
    (`#external-agents`, `Accept external agents`) are classic-only.
  - Context and Memory: Context (`/next/context`, from the rail and the
    old `/memory` link) with its Standing Instructions (Save instructions,
    Revert), Memory Documents (Packs) -- search, create, edit and delete a
    throwaway document, the editor/preview modes, Stale and Empty marks --
    and the Namespace Browser (render modes, grep in a subtree, copy a
    file); pick a repository scope and Forget scope on a throwaway one.
    Confirm Save instructions persists what is typed and a reload reads
    it back. Settings → Memory (`/next/settings/memory`) shows the
    deployment's notes; per-repository notes there are classic-only.
  - Stub the GitHub, identity, upgrade, model-provider and config-repo
    boundaries (the model provider where a connection test reaches it)
    only where the demo lacks them, retaining the real Grain server and
    browser UI, and document each intercepted route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-user-system-settings.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.

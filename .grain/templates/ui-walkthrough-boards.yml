name: UI walkthrough - boards, workstreams, agents and visualizations
title: Walk through saved boards, Workstreams, Agents and task visualizations
base: main
auto-merge: true
body: |
  Thoroughly exercise saved views and every presentation of work --
  `/next/tasks`' Boards menu and Timeline, Workstreams, Agents, and the
  classic Boards index and board kinds -- using the seeded demo data and
  the UI's own creation flows, in a real browser against a real server.

  ## Coverage

  - Saved boards on `/next/tasks`: open the Boards menu (focus lands on
    the first board; Tab moves through it; `Escape` closes it with focus
    back on its button), confirm same-named boards are announced apart
    (`Triage, in WT Ops`, `(board-17)`), Save current view… on a narrowed
    tab (`?tab=asked&q=retry`) and on the Timeline, reopen each (the
    Timeline board reopens on the Timeline; a board with no view puts the
    list back), and delete a throwaway board through its confirmation
    (`Escape` deletes nothing). Apply a board saved on the classic UI and
    note whether its narrowing carries over (the two filter grammars are
    a known gap). Confirm a role without `boards:write` sees no Save or
    delete.
  - Timeline on `/next/tasks` (Task view → Timeline, `?view=timeline`):
    still-open tasks draw to the right-hand `now` edge, finished ones stop
    where their work ended and a failed one at its last run; open a task
    from a row's title (`&task=<id>` survives reload, Back returns to the
    Timeline), switch tabs and confirm the view is kept.
  - Workstreams (`/next/workstreams`, and Start a workstream from the
    Create menu): People vs System, the status chips (Needs a person,
    Planning, Running, Blocked, Parked, Done (last 14d)) and the sort
    (Attention first, Last activity, Least done, Most tasks, Newest),
    each kept in the URL through a reload (they replace the history entry
    rather than adding one, and Reset filters clears them). Open a workstream
    (`/next/workstreams/<key>`, including a multi-segment key): its tree
    of tasks nested under who filed what, its done count, the goal in the
    detail inspector (not the header), and a task link into
    `/next/task/<id>` and back. Confirm the root summaries come from one
    `/api/tasks/summaries` read rather than one request per task, and
    that a summary that fails for one entry leaves the rest drawn.
  - Agents (`/next/agents`): every running agent as a card with what it
    is doing now and its CPU reading, quiet runs first; the filter chips
    (All, Working, Setting up, Quiet) and grouping (No grouping,
    Repository, Model, Host work). Select a card (click, Enter on the card
    or on its CPU reading, `j`/`k` in on-screen order) to open the
    inspector, then close it by Close inspector, the pane's ×, `Escape`
    and a second click, confirming the cards go back to full width and
    focus returns to the card; Open full screen opens the task page. At
    phone width the last card stays reachable in the list's one scroller.
  - Classic Boards index (`/boards`, no `/next/` page yet): open it and
    the seeded boards from the rail and direct URLs; folders (same-named
    boards in different folders carry distinct accessible names),
    ordering (including dragging a board below the first section),
    counts, search and sort, Back/Forward/reload, and a failed
    `/api/boards` fetch explaining why rather than saying "No boards
    yet".
  - Request a new board from the Create menu (New board, on `/next/` and
    classic) and from the Boards index header, and inspect the resulting
    task or proposal, so the asynchronous creation contract is verified
    rather than bypassed; confirm a viewer role lacking `tasks:write` is
    not offered New board, Edit board, kanban/list drag reorder, or
    dashboard Add panel / Keep.
  - List and kanban (classic): open task detail from rows and cards,
    edit column definitions, move cards and columns by mouse and
    keyboard/tap (move slots identify tasks by id), and verify state and
    order persist. Confirm "Merging", the blocked oval, `keep_running`
    markers, the held-for-approval, `imported` and `Rolled over to #M`
    chips, and that custom columns tell "Asked to submit" from "Asked for
    a reply" in the "in no column" summary.
  - Timeline/gantt and Tree (classic): change range and lanes (the Asked
    lane after Running), inspect bars, dependencies and the today marker,
    open a task from a bar; on a `tree` board confirm tasks nest under the
    task that filed them and the board's narrowing survives a reload.
  - Dashboard and Report (classic): whole-board narrowing (no Keep on a
    throughput panel the narrowing would not change); configure, add,
    reorder and open panels, follow their links into task lists and
    confirm Back restores focus to the link; on Report change `?window=`,
    Refresh, reorder its sections (silent ones omitted) and follow task
    references and backlog counts (chip counts match the lists).
  - Exercise delete and confirmation only where the UI actually exposes
    it, and only against throwaway objects created in this run.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-saved-boards-and-visualizations.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.

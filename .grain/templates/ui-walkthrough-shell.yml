name: UI walkthrough - responsive shell and live sessions
title: Walk through responsive navigation and live-session UI
base: main
auto-merge: true
body: |
  Thoroughly exercise the shared shell and the live interaction
  surfaces across desktop, tablet and phone layouts, in a real browser
  against a real server.

  ## Coverage

  - Every `/next/` page at every width: walk each rail destination
    (Inbox, Workstreams, Tasks, Agents, Sessions, Processes, CI, Repos,
    Telemetry, Context, Fleet, Settings) and a deep link to a task page at
    1440×900, a tablet (820×1180 and landscape) and phones (390×844,
    320×568, and 844×390 landscape), in light and dark. Assert one `h1`,
    no horizontal page overflow, no control off screen or under another,
    no clipped bottom bar, nested scrollers that reach their last row,
    dialogs that stay inside a phone's screen, long names, Markdown and
    tables that wrap, and no console errors. Resize a live page through
    those widths and confirm the rail gives way to the compact nav without
    losing state.
  - The rail and top bar on desktop, by mouse and keyboard: each
    destination becomes the only `aria-current="page"` item, its
    accessible name is its label (the Inbox link is "Inbox" with its count
    apart, not "13Inbox"), each tip explains the page, and Back/Forward
    walk the history. The Create menu (New task, Start a workstream, New
    session, Task from template, Run a suite, New schedule, New board)
    opens on click and Enter and closes on `Escape` (focus back on
    Create), an outside press and Tab out. The More menu holds hidden
    destinations. `Filter this view` and its `/` shortcut, the Next up
    chip (`Next up · Queue empty`, or `N waiting on deps`, with its popover
    linking to the backlog), and the light/dark toggle (`t`).
  - Account and navigation customization: the Account popover (who is
    signed in and how, the role, Customize navigation…, Sign out) closes
    on `Escape` with focus back, and stays inside the viewport at 320 px;
    Customize navigation hides, shows and reorders rail destinations, the
    choice survives a reload and agrees with Preferences' rail order, and
    `Escape` hands focus back to Account. Help (`?`, the Help, glossary
    and keyboard shortcuts button) opens and closes; the single-key
    shortcuts toggle turns `c`, `/`, digits, `,`, `0`, `t`, `?` and the
    Inbox's `j`/`k`/`x` off, and typing `a?b` into a field types it rather
    than acting.
  - Phone (`/next/`, touch): the compact nav (Inbox, Tasks, Sessions,
    More) along the bottom edge at full width; the More sheet listing the
    other destinations, Settings and the create actions, locking
    background scroll, never rising past the top of the screen, closing
    when a destination is tapped and on `Escape` with focus back on More;
    the phone New-task button opening the New task sheet full screen with
    its submit action in view.
  - Shell state: the bottom bar (the build stamp linking to Settings →
    Upgrade, the running-agents reading linking to Agents, and `Updated
    … ago`), the dispatch banner and live pill, the thin navigation
    progress bar for a navigation still pending after a moment (the page
    under it stays usable), the snackbar, page chunks preloaded after
    start-up so a click on a stalled origin still navigates, and
    idempotent reads retried on a transient `verifier_unavailable`. With
    `/api/tasks` refused, Tasks and the Inbox say the task list could not
    be read; with every `/api/**` call held, record what `/next/` shows
    (no disconnected banner yet -- a known gap) and that it recovers
    without a reload once calls are released. Old `/t/<team>/…` links land
    on the same page without the team.
  - Director drawer (`d` or Alt+D, or the Director button, from any page):
    it opens beside the page, takes a message, can be compacted, Open
    Director in Sessions goes to `/next/sessions/director`, and Close
    Director drawer (or `Escape`) returns focus. Shape with Director in
    the New task sheet and in a task's Edit panel applies the refined task
    back into the form.
  - Sessions (`/next/sessions`, Director first; `/next/director` lands on
    `/next/sessions/director`): New session from the Create menu and the
    page (focus in Name, the composer focused once created, Create kept in
    view on a short phone, no team fields); the first message shows at
    once and renders Markdown and tables, a follow-up send queues behind
    it, and reload keeps the session. The settings panel (Model, Network
    access, Capabilities, keep running, approval, repositories) and a
    handover note; the artifacts and workspace canvas (Pending task
    proposals with Approve, a Proposed workstream, Save to Memory / Pin to
    Memory) and Close workspace canvas; Delete asking first, and a deep
    link to a deleted session saying it does not exist (with the list
    beside it on desktop), never another session's chat; a failed
    `/api/console-sessions` read shown as an alert, not an empty list.
  - Interactive task chat on `/next/task/<id>` (Conversation tab): send
    and render messages, open it full screen (Shift+F), and confirm a
    pending `request_access` or config-change card is reachable beside it.
  - Accessibility and engines: keyboard-only and coarse-pointer paths,
    focus restoration on every `Escape` (including an inner menu like Add
    grant… closing alone), accessible names, role-gated shell rendering
    for a viewer without write scopes, reduced motion, WCAG AA contrast in
    light and dark, and the same sweep in WebKit where supported.
  - Classic-only shell surfaces (walk at `/` until `/next/` has them, and
    say so in the report): Collapse/Expand sidebar and `[` (persisted,
    ignored while typing); pinned items and Customize pins (boards,
    sessions, System tabs); the Staging list (linked to each host port or
    `/staging/` sub-path, pinnable, marked when unreachable); the
    `UserTile` at the rail's foot (`GET /api/whoami`, opening Settings →
    Access, compact Log out behind verified identity); the "More page
    actions" header rail (expanding on Tab); the alerts bell and panel;
    the disconnected banner (failed polls and a daemon that holds
    connections, clearing once it answers) stacked with the host-mode
    install notice; the phone drawer with `Signed in as` / Log out and
    the build stamp at its foot; and classic session extras (Pin to
    sidebar, Start a fresh chat with summary handover, `Adopt shipped
    defaults`, stale-tab retry, the `"none"` network warning, and Pause
    and Resume in a task-bound chat).
  - The demo may not provide session managers, live streams, banners or
    device metrics. Intercept only those external or live boundaries,
    with realistic incremental, disconnect, empty and error states; keep
    navigation, rendering, browser layout and the real Grain server in
    the loop. Do not weaken the exercise into screenshot-only inspection.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-responsive-navigation-live-sessions.md`. Do not
    commit screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.

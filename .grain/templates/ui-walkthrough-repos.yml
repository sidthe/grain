name: UI walkthrough - repositories, merge queue, releases
title: Walk through repository, merge queue, and release UI
base: main
auto-merge: true
body: |
  Thoroughly exercise the repository-centric operator workflow, in a
  real browser against a real server.

  ## Coverage

  - Repos (`/next/repos`, from the rail after CI and from a direct URL):
    every repository the deployment knows (the config repo, target repos,
    repos with configuration of their own), each row's open work by state
    with Blocked first and its activity dot; search and sort in `?q=` and
    `?sort=` through reload and Back/Forward; long names at phone width.
    Reorder rows by pointer drag and from the handle's keyboard (Space,
    arrows, Home/End, `Escape`, announced), and confirm the order is
    shared with the classic `/repos` list. Use Add repo: discovery
    suggestions and the status line, a Clone URL for a host no connection
    covers, the lock while adding (`Adding…` / `Added`), and the
    confirmation before a first add narrows an unrestricted allowlist,
    naming the repos that fall off and what would be stranded.
  - Follow a row's `N open` link into `/next/tasks?repo=` (case-insensitive
    repo matching; counts are open work only) and back, open a row into
    its repo page and use the page's back link to return to Repos. Confirm
    that a removed repository's remaining tasks still show, and file a
    task from the repo page with the repository preselected.
  - Repo page tabs (`/next/repos/<owner>/<name>/<tab>`, and the host form
    `/next/repos/<host>/<owner>/<name>/<tab>`): Overview, CI & Workflows,
    Merge Queue, Agents & Grants, Branches, Releases and Advanced, each
    through reload and Back/Forward, the selected tab kept in view on a
    phone, and the classic `/repos/<owner>/<name>/settings/<tab>` address
    landing on the same repository and tab. Reach them also from
    Settings → Repositories (`/next/settings/repositories`).
  - Inspect and safely edit each tab: Overview's summary and GitHub issue
    import (Enable issue importer, Queue imported tasks at once with its
    trust warning, Issue label filter, Source repository, and Import
    issues now reporting
    read/imported/skipped counts or saying it read nothing); CI &
    Workflows' CI mode (only the modes the server accepts), Watch default
    branch and the workflows; Agents & Grants' default capabilities,
    Standing prompt extension and Sandbox setup command; Branches' Add
    branch (a refused name shown on the box). Confirm leaving with an
    unsaved edit asks first, refused saves show their banner and clear on
    the next clean save, and config-repo-locked or role-restricted
    settings render read-only with their reason.
  - Advanced tab (`/next/repos/<owner>/<name>/advanced`): the `.grain/`
    declarations switch with the last read's status (commit, counts, a
    failed read and what still runs from the last good commit, warnings),
    the Trigger files (linked from `/next/processes` trigger rows), Extra
    push refs (May also push), the Ports pairing and per-direction table,
    and Remove repository -- its confirmation names what removal strands
    and whether taking the only allowed repo off unrestricts the
    deployment, then lands on `/next/repos`; the config repo and an
    off-allowlist repo show no Remove and say why, and a role without
    `repos:write` sees the switch and Remove disabled. Remove only a
    throwaway repository. At phone width its tables stay inside the
    screen.
  - Merge Queue tab and Settings → Repositories: Require branch up to
    date before merge, Merge on green (its copy makes no ordering claim),
    Base-branch repair PRs may merge without a human (turning it on asks
    first in both places; turning it off does not); save, reload and
    confirm both places read the same values.
  - Releases tab: the release list and the release workflow switch,
    create a release (a refused name reported inline on its box and
    cleared on edit), Cut new RC, Promote current RC, Merge back and
    Delete -- each asks before acting and says why when greyed out --
    and the qualification status, candidates and decisions it shows.
  - Classic-only repository surfaces (walk on the classic UI until
    `/next/` has them, and say so in the report): the compare page
    (`/repos/<owner>/<name>/compare/<base>...<head>`, branch names with
    slashes or `#`, the diff, a direct link and reload, an unknown ref);
    per-release URLs (an unknown release falling back to the newest with
    an in-place explanation); the qualification plan editor (unsaved-edit
    guard, config-repo read-only notice) and release trains; Work
    ownership (the Standing work on this deployment switch and per-item
    overrides); the base-gate warnings on Overview and Releases when CI
    mode is GitHub or none (linking to CI Mode and clearing once fixed);
    the CI capabilities card (the `release` server's methods and policy
    verdicts); Unfixable checks and the merge queue's overlap re-check
    panel (standing chip, elapsed time against max age, CI run and task
    links) on the repo and task pages; the issue-import interval and the
    Upstream repository for fork-to-upstream pull requests; and Settings →
    Repositories' declarations and git-connection columns.
  - If GitHub-derived branches, issue import, release state, or train
    execution is unavailable in the demo, intercept only that external
    boundary with realistic success, empty, loading and failure
    responses; do not replace Grain's own API or either UI.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-repository-release-memory-ui.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.

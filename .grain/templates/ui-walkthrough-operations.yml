name: UI walkthrough - Fleet, Telemetry, CI, Upgrade, alerts and banners
title: Walk through Fleet (Sandboxes, Hosts, Pauses & Controls, Daemon Logs), Telemetry, CI, Settings → Upgrade, alerts and banners
base: main
auto-merge: true
body: |
  Thoroughly exercise the observability and operator-control screens --
  Fleet and its tabs (the classic System view's successor), Telemetry,
  the rail's CI page, Settings → Upgrade, the dispatch banner and the
  classic System tabs, alerts bell and banners `/next/` has not taken
  over yet -- in a real browser against a real server. The settings
  that tune the same machinery are Settings' (the settings and
  infrastructure walkthroughs).

  ## Coverage

  - Fleet (`/next/fleet`, from the rail): its tabs (Sandboxes, Hosts,
    Pauses & Controls, Daemon Logs) in `?tab=` through reload and
    Back/Forward (the selected tab kept in view on a phone, including a
    deep link to `?tab=logs`), and the classic addresses landing where
    their content now lives: `/system/health`, `/system/sandboxes` and
    `/system/top` on Fleet, `/system/logs` and `/admin/logs` on Daemon
    Logs, `/system/pipeline` and `/system/power` on Pauses & Controls,
    `/system/caches` on Settings → Caches, `/system/metrics` (keeping its
    query) on Telemetry, and `/system/upgrade` on Settings → Upgrade.
  - Fleet → Sandboxes: the host strip (CPU, vCPU, memory, disk), the live
    sandboxes table, persistent sandboxes and their empty state, the Host
    Process Snapshot (top) expander, and the warnings above the host
    strip -- dispatch blocked, and "Publishing held" (linking to the
    release triage task) or "Publishing nothing" for a base branch whose
    releases keep failing -- with no sideways scroll and the icon on the
    first text line at phone width.
  - Fleet → Hosts and Daemon Logs: each host's state and runs; tail,
    search and refresh the daemon log.
  - Fleet → Pauses & Controls: Pipeline Dispatch Gate (pause and resume,
    confirming), Model Usage-Limit Pauses (lift one; its reset time shown
    on the local clock), Proxy & Actions Caches, and Daemon Lifecycle's
    Restart daemon (its confirmation and a refused restart's message).
    Confirm pausing, resuming or lifting a quota pause updates the shell's
    dispatch banner and live pill at once. Never actually restart or
    otherwise mutate the host; intercept only those POST boundaries and
    verify cancel, success and failure.
  - CI (`/next/ci` and `/next/ci/runs/<id>`, from the rail and from a
    task's Changes and CI): the status filter (All, Passed, Cancelled, …)
    and provider filter (All providers, Grain CI, GitHub Actions); open a
    run, its jobs, steps and log output (each row's open control named
    after its own run, the selected run kept in the URL), direct link and
    reload, a run id the daemon no longer remembers (no repeated polling
    of a 404), Re-run and Re-run failed (following to the run it starts,
    and re-running only failed jobs on a non-task run), Cancel run, and a
    shared CI fault with the task assigned to it.
  - Telemetry (`/next/telemetry`, from the rail; classic `/metrics` and
    `/system/metrics?f=repo:any:<owner/name>` links keep their scope): the
    time windows, repository and author narrowing in the URL, the charts
    and their empty/loading/failure states, the Token usage & budgets
    editor (a paused scope's reset staying on the pill's line), the
    rollups and their workstream task links.
  - Settings → Upgrade (`/next/settings/upgrade`, Daemon version & live
    upgrade, from the build stamp in the bottom bar and the old
    `/system/upgrade` link): the running version (falling back to
    `/api/config`'s version), "Not available" when this deployment cannot
    upgrade itself, externally managed mode with its management URL, the
    target and its release notes, and Start upgrade asking first. Never
    actually start an upgrade; intercept only that POST.
  - The shell's dispatch banner and the Inbox's Blocked & alerts tab:
    a blocked pipeline, a quota pause and a held merge each show and clear
    without a reload; acknowledged alerts leave the Inbox count.
  - Classic-only operations surfaces (walk on the classic UI until
    `/next/` has them): System → Health (the alerts bell's list, config-repo
    backing state, restart-pending and unrunnable settings linking to
    their `#<field-id>`, overcommit status and history, the GitHub API
    budget and idle-poll backoff, daemon health counters, the
    `grain hostd` readiness note, the host-mode install notice); the auto
    overcommit adjustments card, the folded `"CI sandboxes (N)"` row and
    per-sandbox trends; per-ecosystem and per-repository cache Flush
    buttons; Power's Reboot host and Shut down host (intercepted); the
    `/ci` Active sandboxes table; the 90-day metrics window and the
    dashboard throughput link; Upgrade's searchable target picker,
    breaking-change callouts, retracted-release and discarded-RC banners,
    Image source card and offline database migration panel; and the
    header alerts bell, disconnected banner (failed polls and a daemon
    that holds connections without answering, clearing once it answers)
    and install notice.
  - Stub only boundaries the demo cannot supply (host metrics, upgrade
    sources, GitHub API budget, live CI providers), keep the real Grain
    server and browser UI in the loop, and document every intercepted
    route.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-deployment-operations.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.

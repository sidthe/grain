name: UI walkthrough - intake, inbox, task lifecycle
title: Walk through task intake, inbox, and lifecycle UI
base: main
auto-merge: true
body: |
  Thoroughly exercise the operator workflow from incoming work through
  task disposition, in a real browser against a real server.

  ## Coverage

  - Inbox (`/next/inbox`, from the rail and the brand mark): its headline
    count and the rail badge agree (acknowledged alerts, waiting
    local-script calls and config-repo sync failures counted the way the
    page says, and an acknowledged alert leaving both counts at once);
    the filter tabs (All, Asked, Releases & scripts, Merges, Proposals,
    Blocked & alerts, Paused, Unread) narrow the queue; `j`/`k` move the
    selection and `x` ticks a row; and a cold `/api/tasks` failure says
    the task list could not be read rather than claiming nothing is
    waiting. Select a row of each kind and drive its inspector: approve a
    proposal, answer a parked question (a long Markdown question renders
    in a capped box inside the pane, and a half-typed reply survives a
    refresh), take a review decision with the change's diff beside it,
    Submit a submittable changelist inline (kept out of the group's
    Submit all), approve and reject a pending release (Approve short soak
    while the soak is still running), approve a local-script call, and
    Acknowledge, Investigate and Clear an alert. A stuck row offers its
    sub-case's own control (Run now, Cancel, Undefer or Retry merge);
    press one and confirm the row leaves. Use a group's bulk action
    (Approve all, with the confirmation that names repositories and
    owners and holds the button until "I am approving work owned by
    someone else" is ticked when it applies), and confirm a base-branch
    repair asks before it may merge without a human. Reload and confirm
    every gesture held; at phone width confirm the explanations drop and
    nothing overflows.
  - New task sheet (the rail's Create menu → New task, `c`, and the phone
    New-task button): template picker (a template with input fields
    shows them; its priority carries across), title, description and
    attachments (staged chips with remove), custom fields, repository
    (refused when missing), Create a new branch and base, auto-merge,
    the model picker (only models enabled connections advertise),
    Depends on, Capabilities & repo context (Add API scope or method
    grant; `Escape` inside its menu closes only the menu), More options,
    Found in release, Approve and start now and Put at front of queue.
    Open the Shape with Director pane, apply a suggestion back into the
    form, close it. Confirm `Escape` keeps the draft and reopening
    restores title and staged attachments, then file through Create and
    start and through the proposed path, and confirm the task lands in
    the expected tab with its attachments stored.
  - Classic-only intake (walk these at `/new` while `/next/` lacks them,
    and on `/next/` as soon as it has them): `/new?field.<name>=` links
    and the notice naming values a `settings/new-task-form.yml` drops;
    no-repo filing and the off-allowlist target warning; the
    `<fork-owner>:<branch>` fork head label (malformed labels hold Create
    task disabled); free whole-number Task priority (`1e3` normalized,
    zero/negative/fractional refused); Owner, Reviewers, External ref,
    Keep running, Don't port, This fixes a red base branch, Admission
    (`Standard`, `Bypass queue`, `Durable`) and Hosting; capability policy
    verdicts and the toast naming default grants dropped by policy.
  - Tasks (`/next/tasks`): the tabs (Backlog, Needs approval, Running,
    Asked, Submit & land, then Deferred, Closed and All set aside) with
    their counts; Order (Run order, Priority, Oldest, Newest); Group by
    (None, Workstream, Repository); `Filter this view` (`/` focuses it)
    written to `?q=` and kept across tabs, Back/Forward and reload;
    Closed's Merged / Not merged / All filter; and the list's failure
    state when `/api/tasks` cannot be read before or after the page
    starts. On the rows, confirm the state ovals, a waits-on-a-dependency
    count, priority badges, the `Rolled over to #M` pill and stuck rows'
    own controls. In Run order, move a backlog task by drag and by
    keyboard (Space to pick up, arrows/Home/End, Space to drop, Escape to
    cancel, announced in the live region) and confirm the order holds
    after reload. Open a task in the side pane (`?task=`), resize the list
    (List width), and open it full screen.
  - Selection bar on `/next/tasks`: tick several rows and use Move to
    top, Move to bottom, Approve, the priority picker, Defer, Bring back
    (on Deferred), Reopen and Close (with its Close / Keep confirmation),
    confirming a partial failure names the tasks that did not move, then
    Clear. Bulk edit, Submit, Retry merge, capability attach/detach, Run
    selected now and the manual-pipeline "waits for Run now" row marker
    are still classic `/tasks` only: walk them there, with manual mode set
    from Fleet → Pauses & Controls (or classic System → Pipeline), until
    `/next/` has them.
  - Task page (`/next/task/<id>`, from the Inbox, Tasks, a workstream and
    a direct link; old `/tasks/<id>` links land here): the header and its
    tabs (Conversation, Runs, Changes and CI, Workstream, Details), each
    surviving reload and Back. Edit (title, description, priority from its
    picker, auto-merge) and Save changes; set, re-save and clear a goal
    (Base branch green with Notify & back off; the re-saved goal keeps its
    `on_limit`, and a cleared goal leaves no Details line); add and remove
    a dependency (chips read `#N <state>` with the title on hover, and the
    Backlog's waiting count follows); approve a proposal; Defer, Defer
    until… (tomorrow is the earliest day, and the deferred task says when
    it wakes) and Bring back; Close and Reopen (the history names who did
    each); Run now; and Retry on a failed task.
  - Pause and the run's controls on the task page: Pause a running task
    (it asks first before discarding unpushed work), confirm no dead
    second Resume is offered on a paused, stopped task, and Resume. On
    Changes and CI: the grain CI verdict and its link into `/next/ci`,
    Re-run CI and Retry merge, the merge-queue line saying why it gave up,
    and Force merge… (gate ticks and a required reason; offered only with
    full access; `Escape` closes it). Confirm the page follows each
    without a reload.
  - Holds and cards the task page can carry: a pending `request_access`
    card (its reason rendered as Markdown; refused and already-held items
    unticked and disabled; Grant all turning into Grant selected (N);
    dangerous items marked; Deny… needing a reason) granted and denied;
    path-trigger, security and review-findings (`Release hold`) callouts
    with their review-task links and the review-gate override offered
    only while it can act; the merge-rules card listing each requirement
    with its rule and the named approvals still owed; the rolled-over
    task's banner naming its successor and the successor's linking back;
    an inline config-repo change card (Approve & merge config, gated on
    `settings:write`); a parked question's callout; and the live run
    transcript and per-run token usage on Runs.
  - Classic-only task detail (walk at `/tasks/<id>` until `/next/` has
    them): the full-screen image viewer (`X`/backdrop/`Escape`, arrows,
    `i / N`, Download), Mermaid rendering (zoom, fullscreen,
    invalid-syntax fallback), Owner/External ref/Reviewers/Keep
    running/custom-field edits, Admission and Hosting on an open task,
    `This fixes a red <base>`, the pending-secret box (its value never in
    the timeline), host-script approvals with stdin preview, cross-team
    approvals, and the CL chip with presubmit/review/behind badges.

  ## Walkthrough protocol

  - Build and start this repository's real `grain demo` server over a
    throwaway embedded store, open its built frontend in an actual
    Playwright browser, and interact through visible UI controls. Do not
    substitute a source review, a jsdom-only test, or an API-only
    exercise for the walkthrough.
  - Prefer the Gemini-backed model and tooling when this sandbox carries
    a key at `/home/debian/.gemini-api-key`; never print, log or commit
    it. A repository-declared template carries no capabilities of its
    own, so what the sandbox holds is whatever this deployment already
    gives tasks in this repository.
  - Walk the new UI at `/next/` first: it is the new experience, and the
    classic UI at `/` is being deprecated ("Two UIs" in `PROMPT.md`).
    `ui-ng/src/app/shell/nav.ts` (the rail) and
    `ui-ng/src/app/app.routes.ts` (every route) say which pages have
    moved over -- a page in neither, such as Boards, is classic-only;
    walk each step on its `/next/` page where one exists, and on the
    classic page only where it does not yet. Note in the report
    which UI each step ran against, and which steps have no `/next/`
    page yet. Fix a classic page only where it is broken for users
    today, and fix the same page in `ui-ng/` too. New regression
    coverage goes in a `ui-ng/e2e/` spec (run with
    `make test-e2e-ng`), not a classic one; keep the
    classic specs passing and don't delete them.
  - Explore beyond the scripted cases in `ui/e2e`. Check browser console
    errors, failed network requests, loading/empty/error states,
    keyboard reachability, and destructive-action confirmations relevant
    to this area.
  - Confirm mutations by returning to the screen, reloading and
    deep-linking where applicable, and observing the persisted result.
    Stub only an unavailable external or system boundary; keep the real
    server, frontend, browser and user gestures in the loop, and
    document every stub.
  - Record the commit tested, the environment, the exact steps, the
    outcomes and every stub in a dated report under `docs/test-runs/`,
    named `YYYY-MM-DD-task-intake-inbox-lifecycle.md`. Do not commit
    screenshots or generated browser artifacts.
  - For each bug found: capture a deterministic reproduction; fix it in
    this task when the correction is safe and scoped; add regression
    coverage at the strongest practical level; and run the relevant
    tests. If the fix is unsafe, materially separate, or needs
    infrastructure this sandbox does not have, propose a focused
    follow-up task with `branch: "main"` carrying the reproduction,
    the evidence and the expected behaviour.
